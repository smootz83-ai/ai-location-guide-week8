<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="나만의 위치 안내 서비스 - 내 주변 장소를 쉽게 찾아보세요">
  <title>나만의 위치 안내 서비스</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- 1. 메인 타이틀 및 설명 -->
    <h1>📍 나만의 위치 안내 서비스</h1>
    <p class="description">내 주변의 장소를 쉽고 빠르게 찾아보세요.</p>
    
    <!-- 2. 사용자 조작 안내 가이드 배너 -->
    <div class="guide-banner">
      <span class="guide-icon">💡</span>
      <span class="guide-text">아래 장소 버튼을 누르면 지도가 해당 위치로 부드럽게 이동합니다!</span>
    </div>

    <!-- 3. 화면 중앙에 배치되는 지도 -->
    <div id="map"></div>

    <!-- 4. 현재 선택된 장소 설명 카드 -->
    <div class="info-card">
      <h2 id="selected-title">장소 로딩 중...</h2>
      <p id="selected-desc">설명을 불러오는 중입니다.</p>
    </div>

    <!-- 5. 큼직한 장소 선택 버튼 목록 (가로 정렬, JS로 동적 생성) -->
    <div class="places-list" id="places-list">
      <!-- 백엔드 /api/places 데이터로 버튼이 자동 생성됩니다 -->
    </div>
  </div>

  <!-- 
    카카오맵 JavaScript SDK 불러오기 (autoload=false 적용)
    SDK 스크립트가 완전히 로드된 후 kakao.maps.load() 함수를 통해 지도를 초기화합니다.
  -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=30c689a44af9d4aadb7b449a0a2eb2e9&autoload=false"></script>
  
  <script>
    // 장소 데이터 목록 (서버 API에서 동적으로 불러옴)
    let places = [];
    let map = null;
    let marker = null;
    let infowindow = null;

    // 서버 API에서 카페 5개 데이터 불러오기
    async function fetchPlaces() {
      try {
        const response = await fetch('/api/cafes');
        const data = await response.json();
        places = data.cafes || data;
        renderButtons();
      } catch (err) {
        console.error('카페 데이터 불러오기 실패:', err);
      }
    }

    // 장소 버튼 동적 생성 함수
    function renderButtons() {
      const listContainer = document.getElementById('places-list');
      listContainer.innerHTML = '';

      places.forEach((place, index) => {
        const btn = document.createElement('button');
        btn.className = 'place-btn';
        btn.onclick = () => selectPlace(index);

        const iconSpan = document.createElement('span');
        iconSpan.className = 'btn-icon';
        iconSpan.innerText = place.icon || '📍';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'btn-name';
        nameSpan.innerText = place.name;

        btn.appendChild(iconSpan);
        btn.appendChild(nameSpan);
        listContainer.appendChild(btn);
      });
    }

    // 카카오맵 SDK 로드 완료 후 지도 및 데이터 초기화
    kakao.maps.load(async function() {
      // 1. 서버 API 데이터 가져오기
      await fetchPlaces();

      if (places.length === 0) return;

      // 2. 지도를 표시할 HTML 태그 가져오기
      const container = document.getElementById('map');
      
      const options = {
        center: new kakao.maps.LatLng(places[0].lat, places[0].lng),
        level: 3
      };
      
      map = new kakao.maps.Map(container, options);

      marker = new kakao.maps.Marker({
        position: map.getCenter()
      });
      marker.setMap(map);

      infowindow = new kakao.maps.InfoWindow({
        removable: true
      });

      kakao.maps.event.addListener(marker, 'click', function() {
        infowindow.open(map, marker);
      });

      // 첫 번째 장소 선택
      selectPlace(0);
    });

    // 특정 장소를 선택했을 때 전체 상태를 업데이트하는 함수
    function selectPlace(index) {
      if (!places[index]) return;
      const selected = places[index];

      document.getElementById('selected-title').innerText = selected.name;
      document.getElementById('selected-desc').innerText = selected.desc;

      if (!map || !marker || !infowindow) return;

      const newPos = new kakao.maps.LatLng(selected.lat, selected.lng);
      map.panTo(newPos); 
      marker.setPosition(newPos);

      const iwContent = `
        <div style="padding: 8px 12px; font-size: 13px; color: #1e293b; font-weight: bold; text-align: center; font-family: '맑은 고딕', sans-serif; white-space: nowrap;">
          📍 오늘의 장소: ${selected.name}
        </div>
      `;
      infowindow.setContent(iwContent);
      infowindow.open(map, marker);

      const buttons = document.querySelectorAll('.place-btn');
      buttons.forEach((btn, idx) => {
        if (idx === index) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }
  </script>
</body>
</html>

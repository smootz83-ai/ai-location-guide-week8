<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="현재 위치 주변의 카페를 쉽고 빠르게 찾는 지도 서비스">
  <title>내 주변 카페 찾기</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <span class="eyebrow">CAFE MAP</span>
      <h1>내 주변 카페 찾기</h1>
      <p>내 실제 위치를 기준으로 가까운 카페 20곳을 지도에서 보여드려요.</p>
    </header>

    <section class="search-panel" aria-label="카페 검색 조건">
      <form id="search-form" class="search-box">
        <label class="sr-only" for="search-input">카페 또는 지역 검색</label>
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search-input" type="search" placeholder="카페 이름이나 지역을 입력하세요" autocomplete="off">
        <button id="search-button" type="submit">검색</button>
      </form>

      <div class="search-summary">
        <div class="radius-area">
          <span class="control-label">검색 반경</span>
          <div class="radius-group" aria-label="검색 반경 선택">
            <button class="radius-chip active" type="button" data-radius="1000">1km</button>
            <button class="radius-chip" type="button" data-radius="3000">3km</button>
            <button class="radius-chip" type="button" data-radius="5000">5km</button>
            <button class="radius-chip" type="button" data-radius="0">전국</button>
          </div>
        </div>
        <div class="count-box">
          <span>찾은 카페</span>
          <strong id="result-count">0곳</strong>
        </div>
      </div>
    </section>

    <p id="status" class="status loading" role="status" aria-live="polite">
      <span class="status-spinner" aria-hidden="true"></span>
      <span id="status-text">카페 데이터를 불러오는 중입니다.</span>
    </p>

    <section class="content-grid">
      <div class="map-panel">
        <div class="panel-heading">
          <h2>지도</h2>
          <span>마커를 누르면 상세 정보를 볼 수 있어요.</span>
        </div>
        <div id="map" aria-label="카페 위치 지도"></div>
      </div>

      <section class="results-panel" aria-labelledby="results-title">
        <div class="panel-heading">
          <h2 id="results-title">카페 목록</h2>
          <span>현재 위치에서 가까운 순으로 최대 20곳을 표시해요.</span>
        </div>
        <div id="places-list" class="places-list"></div>
      </section>
    </section>
  </main>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=30c689a44af9d4aadb7b449a0a2eb2e9&autoload=false&libraries=services"></script>
  <script src="/app.js"></script>
</body>
</html>

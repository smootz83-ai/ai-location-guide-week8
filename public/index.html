<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="나만의 위치 안내 서비스 - 반경별 & 전국 카페 검색">
  <title>나만의 위치 안내 서비스</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- 1. 메인 타이틀 및 설명 -->
    <h1>📍 나만의 위치 안내 서비스</h1>
    <p class="description">내 주변 반경별 및 전국의 카페를 자유롭게 찾아보세요.</p>
    
    <!-- 2. 반경 선택 큼직한 칩 UI 라벨 버튼 목록 (요구사항 1, 3, 7) -->
    <div class="radius-chip-container">
      <button class="radius-chip active" onclick="selectRadius(1000, this)">1km</button>
      <button class="radius-chip" onclick="selectRadius(3000, this)">3km</button>
      <button class="radius-chip" onclick="selectRadius(5000, this)">5km</button>
      <button class="radius-chip" onclick="selectRadius(0, this)">전국</button>
    </div>

    <!-- 3. 검색어 입력 박스 (요구사항 5) -->
    <div class="search-box-container">
      <input type="text" id="search-input" class="search-input" placeholder="카페 이름 또는 지역 검색 (예: 강남, 스타벅스, 제주)..." onkeyup="if(event.key==='Enter') performSearch();">
      <button class="search-btn" onclick="performSearch()">🔍 검색</button>
    </div>

    <!-- 4. 사용자 조작 및 위치 권한 안내 가이드 배너 -->
    <div class="guide-banner" id="guide-banner">
      <span class="guide-icon" id="guide-icon">📍</span>
      <span class="guide-text" id="guide-text">내 위치를 확인하는 중입니다... (브라우저 위치 권한을 허용해 주세요)</span>
    </div>

    <!-- 5. 화면 중앙에 배치되는 지도 -->
    <div id="map"></div>

    <!-- 6. 현재 선택된 카페 설명 카드 -->
    <div class="info-card">
      <h2 id="selected-title">카페 로딩 중...</h2>
      <p id="selected-desc">카페 정보를 불러오는 중입니다.</p>
    </div>

    <!-- 7. 큼직한 카페 선택 버튼 목록 (가로/세로 반응형 정렬) -->
    <div class="places-list" id="places-list">
      <!-- 백엔드 /api/cafes 데이터로 카페 버튼이 동적 생성됩니다 -->
    </div>
  </div>

  <!-- 
    카카오맵 JavaScript SDK 불러오기 (autoload=false 적용)
    SDK 스크립트가 완전히 로드된 후 kakao.maps.load() 함수를 통해 지도를 초기화합니다.
  -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=30c689a44af9d4aadb7b449a0a2eb2e9&autoload=false"></script>
  
  <script>
    // 기본 상수 및 기본 위치 (서울시청)
    const DEFAULT_LAT = 37.566826;
    const DEFAULT_LNG = 126.9786567;

    // 전역 상태 변수
    let map = null;
    let myLocationMarker = null;
    let circleOverlay = null;
    let cafeMarkers = [];
    let infowindow = null;
    let places = [];
    let currentLat = DEFAULT_LAT;
    let currentLng = DEFAULT_LNG;
    let currentRadius = 1000; // 기본 선택: 1km (1000m)
    let isLocationAllowed = false;

    // 두 지점 간 거리(미터) 계산 함수 (Haversine)
    function getDistanceInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

    // 카카오맵 SDK 로드 완료 후 실행
    kakao.maps.load(function() {
      const container = document.getElementById('map');
      const options = {
        center: new kakao.maps.LatLng(DEFAULT_LAT, DEFAULT_LNG),
        level: 4
      };
      
      map = new kakao.maps.Map(container, options);
      infowindow = new kakao.maps.InfoWindow({ removable: true });

      // 브라우저 위치 권한 요청
      requestUserLocation();
    });

    // 브라우저 위치 권한 요청 함수
    function requestUserLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;
            isLocationAllowed = true;
            updateLocationState(currentLat, currentLng, true);
          },
          function(error) {
            console.warn('위치 권한 거부 또는 실패:', error.message);
            currentLat = DEFAULT_LAT;
            currentLng = DEFAULT_LNG;
            isLocationAllowed = false;
            updateLocationState(DEFAULT_LAT, DEFAULT_LNG, false);
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else {
        currentLat = DEFAULT_LAT;
        currentLng = DEFAULT_LNG;
        isLocationAllowed = false;
        updateLocationState(DEFAULT_LAT, DEFAULT_LNG, false);
      }
    }

    // 위치 상태 업데이트 및 내 위치 마커 설정
    async function updateLocationState(lat, lng, isAllowed) {
      const myPos = new kakao.maps.LatLng(lat, lng);
      map.setCenter(myPos);

      // 내 위치 마커 갱신
      if (myLocationMarker) myLocationMarker.setMap(null);
      myLocationMarker = new kakao.maps.Marker({
        position: myPos,
        map: map
      });

      const locationLabel = isAllowed ? '🎯 내 위치' : '🏛️ 기본 위치 (서울시청)';
      const myIw = new kakao.maps.InfoWindow({
        content: `<div style="padding: 6px 10px; font-size: 12px; font-weight: bold; color: #2563eb; text-align: center; font-family: sans-serif; white-space: nowrap;">${locationLabel}</div>`
      });
      myIw.open(map, myLocationMarker);

      // 현재 반경 모드(기본 1km)에 맞춰 카페 데이터 및 원 업데이트
      await updateRadiusAndCircle(currentRadius);
    }

    // 1. 반경 라벨 칩 클릭 이벤트 핸들러 (요구사항 1, 2, 3, 4)
    async function selectRadius(radiusMeters, chipElement) {
      currentRadius = radiusMeters;

      // 칩 버튼 활성화 색상 스타일 변경 (요구사항 3)
      const chips = document.querySelectorAll('.radius-chip');
      chips.forEach(chip => chip.classList.remove('active'));
      if (chipElement) chipElement.classList.add('active');

      await updateRadiusAndCircle(radiusMeters);
    }

    // 반경 원 변경 및 줌 레벨 조정
    async function updateRadiusAndCircle(radiusMeters) {
      const bannerIcon = document.getElementById('guide-icon');
      const bannerText = document.getElementById('guide-text');
      const banner = document.getElementById('guide-banner');
      const myPos = new kakao.maps.LatLng(currentLat, currentLng);

      // 2. 전국 모드일 때 (요구사항 4)
      if (radiusMeters === 0) {
        if (circleOverlay) circleOverlay.setMap(null); // 반경 원 숨기기
        bannerIcon.innerText = '🌐';
        bannerText.innerText = '전국 카페 검색 모드입니다 (검색어를 입력하시면 해당 전국 카페를 찾아드립니다).';
        banner.style.backgroundColor = '#f3e8ff';
        banner.style.borderColor = '#d8b4fe';
        banner.style.color = '#6b21a8';
        
        map.setLevel(10); // 전국이 잘 보이도록 줌 레벨 확대
      } else {
        // 3. 1km, 3km, 5km 모드일 때 (요구사항 2)
        const radiusText = radiusMeters >= 1000 ? `${radiusMeters/1000}km` : `${radiusMeters}m`;
        
        if (isLocationAllowed) {
          bannerIcon.innerText = '🎯';
          bannerText.innerText = `내 위치 기준 ${radiusText} 반경 내 카페를 안내합니다.`;
          banner.style.backgroundColor = '#eff6ff';
          banner.style.borderColor = '#bfdbfe';
          banner.style.color = '#1e40af';
        } else {
          bannerIcon.innerText = '⚠️';
          bannerText.innerText = `위치 권한 거부로 기본 위치(서울시청) 기준 ${radiusText} 반경 내 카페를 안내합니다.`;
          banner.style.backgroundColor = '#fffbeb';
          banner.style.borderColor = '#fde68a';
          banner.style.color = '#92400e';
        }

        // 반경 원 크기 갱신
        if (circleOverlay) circleOverlay.setMap(null);
        circleOverlay = new kakao.maps.Circle({
          center: myPos,
          radius: radiusMeters,
          strokeWeight: 2,
          strokeColor: '#2563eb',
          strokeOpacity: 0.8,
          strokeStyle: 'dashed',
          fillColor: '#3b82f6',
          fillOpacity: 0.15
        });
        circleOverlay.setMap(map);
        map.setCenter(myPos);

        // 줌 레벨 자동 맞춤
        if (radiusMeters === 1000) map.setLevel(4);
        else if (radiusMeters === 3000) map.setLevel(6);
        else if (radiusMeters === 5000) map.setLevel(7);
      }

      // 검색어 가져오기
      const searchQuery = document.getElementById('search-input').value.trim();
      await fetchNearbyCafes(currentLat, currentLng, radiusMeters, searchQuery);
    }

    // 검색 버튼 클릭 또는 엔터 키 검색 실행 함수 (요구사항 5)
    async function performSearch() {
      const searchQuery = document.getElementById('search-input').value.trim();
      await fetchNearbyCafes(currentLat, currentLng, currentRadius, searchQuery);
    }

    // 백엔드 API에서 조건별 카페 데이터 불러오기
    async function fetchNearbyCafes(lat, lng, radius, query) {
      try {
        const response = await fetch(`/api/cafes?lat=${lat}&lng=${lng}&radius=${radius}&query=${encodeURIComponent(query)}`);
        const data = await response.json();
        const rawCafes = data.cafes || data;

        // 전국 모드가 아닐 경우 반경 필터링 한 번 더 검증
        if (radius > 0) {
          places = rawCafes.filter(cafe => {
            const dist = getDistanceInMeters(lat, lng, cafe.lat, cafe.lng);
            cafe.distance = dist;
            return dist <= radius;
          });
        } else {
          // 전국 모드 (요구사항 5: 결과 일부만 제한적으로 보여줌)
          places = rawCafes.slice(0, 10);
        }

        // 마커 및 하단 결과 목록 동시 갱신 (요구사항 6)
        renderCafeMarkersAndButtons();

        if (places.length > 0) {
          selectPlace(0);
        } else {
          document.getElementById('selected-title').innerText = "검색 결과 없음";
          document.getElementById('selected-desc').innerText = query 
            ? `'${query}' 검색어에 해당하는 카페를 찾을 수 없습니다.` 
            : "선택하신 반경 범위 내에 등록된 카페가 없습니다.";
        }
      } catch (err) {
        console.error('카페 데이터 로드 오류:', err);
      }
    }

    // 지도 마커 및 결과 목록 갱신 (요구사항 6)
    function renderCafeMarkersAndButtons() {
      // 기존 마커 지우기
      cafeMarkers.forEach(m => m.setMap(null));
      cafeMarkers = [];

      const listContainer = document.getElementById('places-list');
      listContainer.innerHTML = '';

      places.forEach((place, index) => {
        const cafePos = new kakao.maps.LatLng(place.lat, place.lng);

        // 지도 마커 추가
        const cMarker = new kakao.maps.Marker({
          position: cafePos,
          map: map
        });

        kakao.maps.event.addListener(cMarker, 'click', function() {
          selectPlace(index);
        });

        cafeMarkers.push(cMarker);

        // 하단 결과 버튼 추가
        const btn = document.createElement('button');
        btn.className = 'place-btn';
        btn.onclick = () => selectPlace(index);

        const iconSpan = document.createElement('span');
        iconSpan.className = 'btn-icon';
        iconSpan.innerText = place.icon || '☕';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'btn-name';
        nameSpan.innerText = place.name;

        btn.appendChild(iconSpan);
        btn.appendChild(nameSpan);
        listContainer.appendChild(btn);
      });
    }

    // 특정 카페 선택 시 지도 이동 및 설명 업데이트 (요구사항 6)
    function selectPlace(index) {
      if (!places[index]) return;
      const selected = places[index];

      document.getElementById('selected-title').innerText = selected.name;
      
      const distInfo = selected.distance ? `(거리: 약 ${selected.distance >= 1000 ? (selected.distance/1000).toFixed(1)+'km' : selected.distance+'m'})` : '';
      document.getElementById('selected-desc').innerText = selected.desc || `[${selected.category}] ${selected.address} ${distInfo}`;

      if (!map || !infowindow) return;

      const newPos = new kakao.maps.LatLng(selected.lat, selected.lng);
      map.panTo(newPos); 

      const iwContent = `
        <div style="padding: 8px 12px; font-size: 13px; color: #1e293b; font-weight: bold; text-align: center; font-family: sans-serif; white-space: nowrap;">
          ☕ ${selected.name}<br>
          <span style="font-size: 11px; color: #64748b; font-weight: normal;">${selected.address}</span>
        </div>
      `;
      infowindow.setContent(iwContent);

      if (cafeMarkers[index]) {
        infowindow.open(map, cafeMarkers[index]);
      }

      const buttons = document.querySelectorAll('.place-btn');
      buttons.forEach((btn, idx) => {
        if (idx === index) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }
  </script>
</body>
</html>
